name: Build

on:
  push:
    tags: '*'
    branches:
      - 'codex/**'
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Tag Name to be created'

jobs:
  build:
    name: Build EX-word addon
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          cd ..
          curl -sSfL https://github.com/MaxSignal/buildscripts/releases/download/Linux/devkitPro.tar.gz | tar -zxf -
          export DEVKITPRO="$GITHUB_WORKSPACE/../devkitPro"
          export DEVKITSH4="$DEVKITPRO/devkitSH4"
          export PATH="$DEVKITPRO/tools/bin:$DEVKITSH4/bin:$PATH"
          git clone --depth 1 https://github.com/TheRainbowPhoenix/libdataplus-ex.git
          cd libdataplus-ex
          make install
          cd "$GITHUB_WORKSPACE"
          make BUILDS=ja
          zip -r build.zip build/ja

      - name: Upload Codex branch build
        if: startsWith(github.ref, 'refs/heads/codex/')
        uses: actions/upload-artifact@v4
        with:
          name: codex-build
          path: build/ja
          if-no-files-found: error

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            gh release create "${{ inputs.tag }}" -t "${{ inputs.tag }}" -n "Automatic build of $(git rev-parse HEAD)." ./build.zip
          else
            gh release create "${GITHUB_REF/refs\/*s\//}" -t "${GITHUB_REF/refs\/*s\//}" -n "Automatic build of $(git rev-parse HEAD)." ./build.zip
          fi
